# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system deps for headless Chromium
        run: |
          sudo apt-get update
          # On Ubuntu 24.04 (noble) the libasound2 virtual package is provided by libasound2t64
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxss1 \
            libxcomposite1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 fonts-liberation

      - name: Extract Mermaid blocks to .mmd
        run: |
          node scripts/extract_mermaid.js

      - name: Render Mermaid .mmd files to SVG (with no-sandbox)
        run: |
          mkdir -p assets/images
          set -x
          for f in $(find assets/images/mmd -name '*.mmd' 2>/dev/null); do
            out="assets/images/$(basename "${f%.*}").svg"
            echo "Rendering $f -> $out"
            npx --yes @mermaid-js/mermaid-cli -i "$f" -o "$out" --puppeteerConfigFile scripts/puppeteer-config.json || true
            if [ -f "$out" ]; then
              echo "RENDERED $out"
            else
              echo "FAILED to render $f"
              # dump the .mmd to help debugging
              echo "--- contents of $f ---"
              sed -n '1,200p' "$f" || true
              echo "--- end $f ---"
            fi
          done
          set +x
      - name: Commit generated diagram SVGs
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "Checking for generated SVGs to commit..."
          git status --porcelain
          git config --local user.email "$GIT_COMMITTER_EMAIL"
          git config --local user.name "$GIT_COMMITTER_NAME"
          git add assets/images || true
          if git diff --staged --quiet; then
            echo "No diagram changes to commit"
          else
            git commit -m "chore: add generated mermaid SVGs [skip ci]" || true
            # Push back to the gh-pages branch
            git push origin HEAD:gh-pages || echo "Push failed"
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # Use the latest supported Ruby for Jekyll/nokogiri
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/ask-the-data"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
